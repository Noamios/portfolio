name: Deploy Portfolio Apps

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: recipe-finder-app/package-lock.json

      - name: Build recipe app
        working-directory: recipe-finder-app
        run: |
          npm ci
          npm run build

      - name: Prepare Pages output
        run: |
          mkdir -p site
          cp -R personal-portfolio-site site/personal-portfolio-site
          cp -R todo-list-app site/todo-list-app
          cp -R movie-finder-app site/movie-finder-app
          cp -R recipe-finder-app/build site/recipe-finder-app
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Noam Portfolio Apps</title>
            <style>
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                margin: 0;
                background: #0f172a;
                color: #e2e8f0;
              }
              .wrap {
                max-width: 760px;
                margin: 48px auto;
                padding: 0 16px;
              }
              h1 {
                margin-bottom: 8px;
              }
              p {
                color: #94a3b8;
              }
              ul {
                list-style: none;
                padding: 0;
                margin-top: 24px;
                display: grid;
                gap: 12px;
              }
              a {
                display: block;
                text-decoration: none;
                color: #e2e8f0;
                background: #1e293b;
                border: 1px solid #334155;
                border-radius: 10px;
                padding: 14px 16px;
              }
              a:hover {
                border-color: #60a5fa;
              }
            </style>
          </head>
          <body>
            <main class="wrap">
              <h1>Noam Portfolio Apps</h1>
              <p>Live links to all projects in this repository.</p>
              <ul>
                <li><a href="./personal-portfolio-site/">Personal Portfolio Site</a></li>
                <li><a href="./todo-list-app/">Todo List App</a></li>
                <li><a href="./movie-finder-app/">Movie Finder App</a></li>
                <li><a href="./recipe-finder-app/">Recipe Finder App</a></li>
              </ul>
            </main>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
