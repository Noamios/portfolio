<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="Day2-style.css">
</head>
<body>
  <div class="container">
    <h1>📝 My Todo List</h1>

    <div class="input-section">
      <input
        type="text"
        id="todoInput"
        placeholder="Add a new todo..."
        autocomplete="off"
      >
      <input type="date" id="dueDateInput">
      <select id="priorityInput">
        <option value="medium">Medium Priority</option>
        <option value="high">High Priority</option>
        <option value="low">Low Priority</option>
      </select>
      <input
        type="text"
        id="categoryInput"
        placeholder="Category (e.g. Work)"
        autocomplete="off"
      >
      <button id="addBtn">Add</button>
    </div>

    <div class="filter-buttons">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
      <button id="clearAllBtn" class="clear-all-btn">Clear All</button>
    </div>

    <div class="organize-row">
      <select id="categoryFilter">
        <option value="all">All Categories</option>
      </select>
      <select id="sortSelect">
        <option value="newest">Sort: Newest</option>
        <option value="oldest">Sort: Oldest</option>
        <option value="priority">Sort: Priority</option>
        <option value="dueDate">Sort: Due Date</option>
      </select>
    </div>

    <ul id="todoList" class="todo-list">
      <!-- Todos will appear here -->
    </ul>

    <div id="emptyState" class="empty-state">
      <p>No todos yet. Add one to get started!</p>
    </div>

    <div class="stats">
      <p>Total: <span id="totalCount">0</span></p>
      <p>Completed: <span id="completedCount">0</span></p>
    </div>
  </div>

  <script src="Day2-script.js"></script>
</body>
</html>
